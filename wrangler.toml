# Cloudflare Pages project config. Build with ./scripts/build-site.sh, then
# deploy from the repo root with `npx wrangler pages deploy`.
# No secrets here: set them with `npx wrangler pages secret put NAME`.
name = "hackachusetts-2026"
pages_build_output_dir = "dist"
compatibility_date = "2026-07-29"

# Workers AI binding used by functions/_lib/llm.ts (POST /api/extract).
# No API key: billed to the Cloudflare account. `wrangler pages dev` calls it
# remotely on the logged-in account, which needs a workers.dev subdomain
# registered on that account.
[ai]
binding = "AI"

# Engine path per endpoint (functions/_lib/fallback/engineFirst.ts).
# Since T18k, /api/rank runs on Jerry's engine (rankCandidatesWithReport, from
# T18h) after the T18i parity check against the fallback on demo-npc1 and
# demo-dmd. next-questions, trials and brief stay on the fallback (unset =
# fallback) until their engine versions are verified the same way.
# Roll back: set RDD_ENGINE_PATH_RANK = "fallback" (or remove it), then redeploy.
[vars]
RDD_ENGINE_PATH_RANK = "engine"
# Optional PubCaseFinder ordering for /api/rank (T36, functions/_lib/fallback/pcf.ts).
# Off unless set. "pcf": PubCaseFinder orders the candidates, evidence still
# comes from HPO annotations and Monarch; on any PubCaseFinder failure the
# Monarch path above answers in the same request.
# RDD_RANK_SOURCE = "pcf"
