<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .bg { fill: #1f6f78; }
    .fg { fill: none; stroke: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #7cc4cc; }
      .fg { stroke: #10262a; }
    }
  </style>
  <rect class="bg" width="32" height="32" rx="8" />
  <rect class="fg" x="8.5" y="8.5" width="15" height="15" rx="3" stroke-width="2.5" stroke-dasharray="3 3" />
</svg>
